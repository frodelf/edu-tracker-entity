name: Java CI with Maven

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'corretto'
          java-version: '17'
      - name: Substitute environment variables in application.yaml
        run: |
#          sed -i "s|\${DB_HOST}|${{ secrets.DB_HOST }}|g" src/main/resources/application.yaml
          sed -i "s|\${DB_USERNAME}|${{ secrets.DB_USERNAME }}|g" src/main/resources/application.yaml
          sed -i "s|\${DB_PASSWORD}|${{ secrets.DB_PASSWORD }}|g" src/main/resources/application.yaml
      - name: Build app
        run: |
          mvn clean
          mvn package -DskipTests=true
      - name: Build Docker
        uses: docker/build-push-action@v2
        with:
          context: .
          dockerfile: Dockerfile
          push: false
          tags: ${{ secrets.secret_name_docker_hub_lower_case }}/spacelab-students:latest
      - name: Login to Docker
        uses: docker/login-action@v1
        with:
          username: ${{secrets.secret_name_docker_hub_lower_case}}
          password: ${{secrets.secret_lower_case_token}}
      - name: push to Docker Hub
        uses: docker/build-push-action@v2
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: ${{ secrets.secret_name_docker_hub_lower_case }}/spacelab-students:latest
      - name: Deploy to SSH server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.remote_server_host }}
          username: ${{ secrets.remote_server_username }}
          password: ${{ secrets.remote_server_ssh_pass }}
          script: |
            if docker ps -a --format '{{.Names}}' | grep -q '^slj-edutracker-entity'; then
              docker stop slj-edutracker-entity || true
              docker rm slj-edutracker-entity || true
            fi
            docker pull ${{ secrets.secret_name_docker_hub_lower_case }}/spacelab-students:latest
            docker run -d -p 7659:8084 --name slj-edutracker-entity --network slj-edutracker-network ${{ secrets.secret_name_docker_hub_lower_case }}/spacelab-students:latest